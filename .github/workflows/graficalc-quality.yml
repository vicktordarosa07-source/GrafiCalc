name: GrafiCalc quality gate
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: graficalc-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck and legacy syntax
        run: npm run check
      - name: Unit regressions
        run: |
          npm run test:workspace-policy
          npm run test:collection-policy
          npm run test:sync-recovery
          npm run test:pricing-regression
          npm run test:operational-regression
      - name: Legacy security checks
        run: |
          npm run test:security:stage3
          npm run test:security:stage4
          npm run test:security:stage5
          npm run test:security:stage-final
      - name: Build
        run: npm run build
      - name: Unauthenticated smoke tests
        run: npm run test:next-smoke
